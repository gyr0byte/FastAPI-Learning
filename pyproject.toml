[project]
name = "fastapi-learning"
version = "0.1.0"
description = "Personal learning repository for FastAPI and Python backend development."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
